# SpaceOS CI — 백엔드 pytest · 데이터 파이프라인 pytest · 프론트 타입체크+빌드
#
# docs/decision-infra-layer-2026-08-25.md §4-1 의 1순위다. 그 문서가 측정해 둔 대로
# 튜닝 없이 그대로 걸 수 있다(백엔드 스위트 약 1분 30초 · 프론트 tsc 수 초).
#
# ⚠ 왜 `infra/github/` 이 아니라 `.github/workflows/` 인가
#   GitHub Actions 는 **저장소 루트의 `.github/workflows/`만** 읽는다. 경로를 설정으로
#   바꿀 수 없다. `infra/github/` 은 `.gitkeep` 만 든 빈 디렉터리로 남아 있었는데,
#   거기에 넣었으면 파일은 있고 CI 는 안 도는 상태가 됐을 것이다.
#
# ⚠ 외부 API 를 치지 않는다
#   `apps/backend/tests/conftest.py` 가 `LLM_API_KEY` 를 전역으로 비운다. 실호출
#   검증(`test_llm_live.py`)은 `SPACEOS_LIVE_LLM=1` opt-in 이라 CI 에서는 skip 된다.
#   즉 이 워크플로는 시크릿이 필요 없고, 포크 PR 에서도 그대로 돈다.
#
# ⚠ Gold 산출물은 저장소에 실려 있어야 한다
#   테스트가 `data/gold/*` 를 직독한다. 새로 클론한 이 환경에는 개발 기계에만 있는
#   파일이 없으므로, 추적이 빠진 산출물은 **여기서 처음 드러난다**
#   (2026-08-25 `platform_posting_store_area.json` 이 그렇게 빠져 있었다).
#   `tests/test_gold_shipping.py` 가 그 자리를 원인 쪽에서 막는다.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 새 푸시가 오면 이전 실행을 취소한다 — 큐가 밀리면 피드백이 늦어지고,
# 늦은 피드백은 안 보는 피드백이 된다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 백엔드 pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'      # pyproject 의 requires-python = ~=3.11.0
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt

      - name: 의존성 설치
        run: python -m pip install --upgrade pip && pip install -r apps/backend/requirements.txt

      - name: pytest
        working-directory: apps/backend
        env:
          PYTHONIOENCODING: utf-8     # 로그의 em dash 가 cp949 에서 죽는다(08-19 실측)
        run: python -m pytest -q

  serverless:
    name: 서버리스 임포트 (배포 의존성만)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # ⚠ 이 잡이 없어서 2026-08-26~27 프로덕션이 약 18시간 죽어 있었다.
    #   백엔드 잡은 `apps/backend/requirements.txt`(sqlalchemy·psycopg2 포함)를 깔고
    #   돌기 때문에 **배포가 쓰는 최소 셋으로는 import 조차 안 된다는 사실을 볼 수 없다.**
    #   여기서는 루트 `requirements.txt` 만 깔아 배포 환경을 그대로 재현한다.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'      # Vercel 서버리스 빌드와 같은 버전(deploy-vercel.md)
          cache: pip
          cache-dependency-path: requirements.txt

      # httpx 는 요청을 태워 보기 위한 **테스트 전용**이다. 앱이 import 하지 않으므로
      # requirements.txt 에는 넣지 않는다 — 넣으면 배포 번들만 커진다.
      - name: 배포 의존성만 설치
        run: python -m pip install --upgrade pip && pip install -r requirements.txt httpx

      - name: 진입점 import + 익명 분석 요청
        env:
          PYTHONIOENCODING: utf-8
          VERCEL: '1'                             # prod 판정을 배포와 똑같이 만든다
          JWT_SECRET: ci-not-a-real-secret        # prod 가드가 요구한다(없으면 기동 실패)
        run: |
          python - <<'PY'
          import importlib.util
          from fastapi.testclient import TestClient

          spec = importlib.util.spec_from_file_location("vercel_entry", "api/index.py")
          entry = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(entry)          # ① import 가 되는가

          client = TestClient(entry.app)
          for path in ("/health", "/api/v1/commercial-districts/"):
              r = client.get(path)                # ② 익명 요청이 DB 없이 도는가
              assert r.status_code == 200, f"{path} -> {r.status_code} {r.text[:300]}"
              print(f"OK {r.status_code} {path}")

          # ③ DB 드라이버(psycopg2)가 없어야 의미가 있는 검사다. 누가 배포 셋에
          #    드라이버를 추가하면 ②가 통과해도 이 성질은 사라지므로 여기서 막는다.
          try:
              import psycopg2                     # noqa: F401
          except ModuleNotFoundError:
              print("OK psycopg2 없음 — 익명 경로가 드라이버에 의존하지 않는다")
          else:
              raise SystemExit("배포 의존성에 psycopg2 가 들어왔다 — 이 검사가 무의미해진다")
          PY

  data:
    name: 데이터 파이프라인 pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: data/requirements.txt

      - name: 의존성 설치
        run: python -m pip install --upgrade pip && pip install -r data/requirements.txt pytest

      - name: pytest
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest data/tests -q

  frontend:
    name: 프론트 타입체크 + 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: 의존성 설치
        working-directory: apps/frontend
        run: npm ci

      # `npm run build` 가 `tsc -b && vite build` 다 — 타입체크와 번들이 한 번에 돈다.
      - name: 빌드
        working-directory: apps/frontend
        run: npm run build
