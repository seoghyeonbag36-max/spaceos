[alembic]
script_location = migrations
prepend_sys_path = .

# sqlalchemy.url is intentionally not set here - migrations/env.py reads it from
# app.core.config.settings so there is a single source of truth for DATABASE_URL.
# (Non-ASCII text avoided in this file: alembic's ConfigParser reads it with
# encoding="locale", which is cp949 on this Windows box and chokes on Korean.)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
